name: Deploy to GitHub Pages

on:
  # Run on every push to master so merges automatically publish.
  push:
    branches: [master]
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

# Permissions required by the GitHub Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deploy to run at a time; queue newer ones, cancel in-progress
# runs that are already superseded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false # Treat eslint warnings as warnings, not errors

      - name: Copy index.html to 404.html (SPA routing fallback)
        run: cp build/index.html build/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on this repo if it isn't already, so no manual
          # Settings → Pages step is required for the first deploy. Requires
          # the workflow to have `pages: write` permission (set above).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
